[package]
name = "xprs"
version = "0.2.0"
edition = "2024"
autotests = false
authors = ["Victor LEFEBVRE <contact@vic1707.xyz>"]
description = "Xprs is a flexible and extensible mathematical expression parser and evaluator for Rust, designed for simplicity and ease of use."
documentation = "https://docs.rs/xprs"
license = "WTFPL"
readme = "README.md"
repository = "https://github.com/vic1707/xprs"
include = [
    "src/**/*",
    "tests/**/*",
    "Cargo.toml",
    "Cargo.lock",
    "build.rs",
    "README.md",
    "LICENSE",
]
categories = ["science", "mathematics", "parser-implementations"]
keywords = ["parser", "math", "library"]
rust-version = "1.88.0"

[package.metadata.docs.rs]
features = ["pemdas", "compile-time-optimizations", "miette"]
no-default-features = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
lexical-parse-float = { version = "1.0.6", default-features = false, features = ["format"] }
miette = { version = "7.6.0", optional = true, default-features = false, features = ["fancy-no-backtrace"] }
thiserror = "2.0.21"

[build-dependencies]
rustc_version = "0.4.1"

[dev-dependencies]
rstest = { version = "0.27.0", default-features = false }

[[bin]]
name = "repl"
path = "src/bin/repl.rs"

[[test]]
name = "integration"
path = "tests/lib.rs"

[features]
default = ["pemdas", "compile-time-optimizations"]
pemdas = []
pejmdas = []
compile-time-optimizations = []
miette = ["dep:miette"]
